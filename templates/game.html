{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicles of Py</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1a1a2e;
        }
        #game-container {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins@1.80.20/dist/rexuiplugin.min.js"></script>

    <script type="module">
        window.CSRF_TOKEN = '{{ csrf_token }}';

        // Cache-busted during development so edits show up on the next reload
        // without needing a hard refresh. Exposed globally so PreloadScene
        // can stamp the same version onto every asset URL it loads (images/
        // spritesheets have no cache-busting otherwise, since Phaser loads
        // them by plain static path).
        const v = '{% now "U" %}';
        window.ASSET_VERSION = v;

        // Must resolve before anything reads window.gameState
        await import('{% static "game/GameState.js" %}?v=' + v);
        const { config } = await import('{% static "game/config.js" %}?v=' + v);

        const [
            { default: BootScene },
            { default: PreloadScene },
            { default: MainMenuScene },
            { default: PrintForestScene },
            { default: LoopForestScene },
            { default: ConditionalCavernsScene },
            { default: BattleScene },
            { default: UIScene },
            { default: SaveMenuScene },
            { default: PauseMenuScene },
            { default: InventoryScene },
            { default: ShopScene }
        ] = await Promise.all([
            import('{% static "game/scenes/BootScene.js" %}?v=' + v),
            import('{% static "game/scenes/PreloadScene.js" %}?v=' + v),
            import('{% static "game/scenes/MainMenuScene.js" %}?v=' + v),
            import('{% static "game/scenes/zones/PrintForestScene.js" %}?v=' + v),
            import('{% static "game/scenes/zones/LoopForestScene.js" %}?v=' + v),
            import('{% static "game/scenes/zones/ConditionalCavernsScene.js" %}?v=' + v),
            import('{% static "game/scenes/BattleScene.js" %}?v=' + v),
            import('{% static "game/scenes/UIScene.js" %}?v=' + v),
            import('{% static "game/scenes/ui/SaveMenuScene.js" %}?v=' + v),
            import('{% static "game/scenes/ui/PauseMenuScene.js" %}?v=' + v),
            import('{% static "game/scenes/ui/InventoryScene.js" %}?v=' + v),
            import('{% static "game/scenes/ui/ShopScene.js" %}?v=' + v)
        ]);

        config.scene = [
            BootScene, PreloadScene, MainMenuScene,
            PrintForestScene, LoopForestScene, ConditionalCavernsScene,
            BattleScene, UIScene, SaveMenuScene, PauseMenuScene, InventoryScene, ShopScene
        ];

        window.game = new Phaser.Game(config);

        // Attach the logged-in user's identity, without touching the
        // level/HP/MP progress GameState.js already restored from localStorage.
        {% if user.is_authenticated %}
        window.gameState.setPlayer({
            id: {{ user.player.id|default:"null" }},
            name: '{{ user.player.name|default:user.username }}'
        });

        // The real inventory lives on the backend (PlayerInventory) once
        // logged in - pull it in over whatever localStorage last had, so a
        // fresh browser/device shows the account's actual items instead of
        // an empty local mirror.
        fetch('/api/inventory/')
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                if (data && Array.isArray(data.results)) {
                    window.gameState.inventory = data.results.map(row => ({
                        name: row.name, type: row.type, quantity: row.quantity
                    }));
                    window.gameState.saveToStorage();
                }
            })
            .catch(err => console.warn('Could not load server inventory (offline?):', err));

        // Same idea for the stat fields the inventory console can touch
        // (attack/defense/.../skillPoints) - current hp/mp and level/xp
        // stay client-authoritative (see GameState.js's addExperience) and
        // are deliberately left alone here.
        {% if user.player.id %}
        fetch('/api/players/{{ user.player.id }}/')
            .then(r => r.ok ? r.json() : null)
            .then(player => {
                if (player) {
                    window.gameState.playerStats = {
                        ...window.gameState.playerStats,
                        attack: player.attack,
                        defense: player.defense,
                        magicAttack: player.magic_attack,
                        magicDefense: player.magic_defense,
                        speed: player.speed,
                        skillPoints: player.skill_points,
                        gold: player.gold
                    };
                    window.gameState.saveToStorage();
                }
            })
            .catch(err => console.warn('Could not load server player stats (offline?):', err));
        {% endif %}
        {% endif %}

        // Debug utilities available from the browser console
        window.debugGame = {
            resetGame: () => window.gameState.resetGame(),
            showSave: () => JSON.parse(localStorage.getItem('chroniclesOfPySave')),
            setPosition: (x, y) => window.gameState.savePlayerPosition(x, y),
            getPosition: () => window.gameState.getPlayerPosition(),
            defeatEnemy: (id) => window.gameState.markEnemyDefeated(id),
            addXP: (xp) => window.gameState.addExperience(xp)
        };
    </script>
</body>
</html>
